server:
  port: 8082
  error:
    whitelabel:
      enabled: false
spring:
  profiles:
    active: "dev"
  application:
    name: arisPayApi
  config:
    # Config server is resolved early (before profile files load).
    # optional: = app still starts if config server is unreachable; local configs act as fallback.
    import: optional:configserver:http://admin:admin123@localhost:8888
  cloud:
    config:
      enabled: true
      label: main
      profile: ${spring.profiles.active:default}   # resolved early; matches active Spring profile
      fail-fast: true
      retry:
        max-attempts: 3
        initial-interval: 1000
        max-interval: 2000
        multiplier: 1.1
      # profile is set per environment in application-{profile}.yml
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  mvc:
    view:
      suffix: html
    static-path-pattern: /resources/static/**
management:
  tracing:
    sampling:
      probability: 1.0
  endpoints:
    web:
      exposure:
        include: health,info,refresh,env
custom:
  arispay:
    openapi:
      dev-url: ${OPENAPI_DEV_URL}
      prod-url: ${OPENAPI_PROD_URL}
    api:
      version: 1
    app:
      jwt-secret: ${JWT_SECRET}
      jwt-expiration-minutes: 1
      jwt-refresh-expiration-seconds: 86400

# File Upload Configuration
file:
  upload:
    path: ${FILE_UPLOAD_PATH:/opt/arispay/media}


