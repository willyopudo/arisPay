server:
  port: 8888

spring:
  application:
    name: config-server

  # Active profiles: jdbc enables JDBC backend; vault enables HashiCorp Vault integration
  profiles:
    active: jdbc,vault,dev

  # ── Database (PostgreSQL) for JDBC config backend ────────────────────────────
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 5

  # ── Flyway migrations ─────────────────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # ── Spring Security – Basic Auth ───────────────────────────────────────────────
  security:
    user:
      name: ${CONFIG_SERVER_USERNAME:}
      password: ${CONFIG_SERVER_PASSWORD}

  # ── Spring Cloud Config Server ────────────────────────────────────────────────
  cloud:
    config:
      server:
        # JDBC backend – reads from the 'properties' table in config_db
        jdbc:
          sql: SELECT key, value FROM properties WHERE application=? AND profile=? AND label=?
          order: 1

        # Vault backend – reads secrets from HashiCorp Vault (Phase 2)
        vault:
          host: ${VAULT_HOST:localhost}
          port: ${VAULT_PORT:8200}
          scheme: http
          token: ${VAULT_TOKEN:arispay-dev-token}   # server-side auth so clients don't need X-Config-Token
          backend: secret
          kv-version: 2                              # Vault dev mode uses KV v2 by default
          default-key: application
          profile-separator: '/'
          order: 0

        # Keep native backend as fallback (lowest priority)
        native:
          search-locations: classpath:/configurations
          order: 2

    # Vault client token authentication
    vault:
      token: ${VAULT_TOKEN:arispay-dev-token}
      authentication: TOKEN
      host: ${VAULT_HOST:localhost}
      port: ${VAULT_PORT:8200}
      scheme: http
      kv:
        enabled: true
        backend: secret
        default-context: arispay
        application-name: arispay

# ── Actuator endpoints ─────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh,env,busrefresh
  endpoint:
    health:
      show-details: always
  health:
    vault:
      enabled: true

# ── Eureka Client ─────────────────────────────────────────────────────────────
# Config server registers itself with Eureka so clients can discover it
# by name (config-server) instead of hardcoding localhost:8888.
# NOTE: fetch-registry=false avoids a circular dependency —
#       config-server must not depend on Eureka to start up.
eureka:
  client:
    register-with-eureka: true
    fetch-registry: false               # no circular dependency
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:${EUREKA_PORT:8761}/eureka/
    registry-fetch-interval-seconds: 30
    eureka-server-connect-timeout-seconds: 5
    eureka-server-read-timeout-seconds: 8
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}
    lease-renewal-interval-in-seconds: 10      # heartbeat every 10s (default 30)
    lease-expiration-duration-in-seconds: 30   # expire after 30s of missed heartbeats

logging:
  level:
    org.springframework.cloud.config: DEBUG
    org.springframework.vault: INFO
